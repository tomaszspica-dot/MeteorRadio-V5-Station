# Example only.
# Copy to a private local path such as:
#   /home/pi/.config/meteorradio/rmob.ini
# and edit locally.
#
# Do NOT commit real private coordinates unless that is intentional.

[station]
observer = YOUR_RMOB_OBSERVER
country = YOUR_COUNTRY
city = YOUR_CITY
longitude = YOUR_LONGITUDE
latitude = YOUR_LATITUDE
frequency_hz = 143050000
antenna = YOUR_ANTENNA
azimuth_deg = YOUR_AZIMUTH
elevation_deg = YOUR_ELEVATION
rf_preamplifier = YOUR_RF_PREAMPLIFIER
receiver = RTL-SDR
method = MeteorRadio V5
computer = Raspberry Pi 4 / Debian 13

[paths]
log_dir = /home/pi/radar_data/Logs
out_dir = /home/pi/meteorradio-rmob/output

# Set this to the timezone used by the naive Y/M/D/h/m/s timestamps
# in RYYYYMMDD_*.csv. Use UTC if the acquisition host itself runs UTC.
source_timezone = UTC

# RMOBclient is a separate binary-only utility distributed by the
# Echoes project. It is intentionally not bundled in this repository.
uploader = /home/pi/meteorradio-rmob/RMOBclient_arm64
