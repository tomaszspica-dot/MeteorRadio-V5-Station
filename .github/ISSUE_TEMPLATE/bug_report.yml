name: Bug report
description: Report a reproducible station-overlay problem
title: "[bug] "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: "Please sanitize logs and never include passwords, exact private coordinates or SSH keys."
  - type: input
    id: component
    attributes:
      label: Component
      placeholder: "8094, 8096, scoring, retention, systemd, radio-owner..."
    validations:
      required: true
  - type: input
    id: platform
    attributes:
      label: Platform
      placeholder: "Raspberry Pi model, OS, architecture"
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What happened and what did you expect?
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Sanitized logs
      render: shell
