title: "[Q&A] "
labels: []
body:
  - type: markdown
    attributes:
      value: |
        Ask a focused question about MeteorRadio V5, GRAVES 143.050 MHz, RTL-SDR, Raspberry Pi, installation, scoring, retention, dashboards, or station operation.
  - type: textarea
    id: question
    attributes:
      label: Question
      description: State the question as clearly as possible.
      placeholder: What are you trying to understand or solve?
    validations:
      required: true
  - type: textarea
    id: setup
    attributes:
      label: Your setup
      description: Include relevant hardware and software details.
      placeholder: Raspberry Pi, SDR, antenna, OS, frequency, relevant service...
    validations:
      required: false
  - type: textarea
    id: tried
    attributes:
      label: What have you tried?
      description: Include commands, logs, screenshots, or observations if useful.
    validations:
      required: false
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: I removed passwords, tokens, private keys, and exact private location data.
          required: true
