title: "[Station / Detection] "
labels: []
body:
  - type: markdown
    attributes:
      value: |
        Show your station, hardware, waterfall, detection, dashboard, antenna experiment, or MeteorRadio-based build. Images are welcome.
  - type: dropdown
    id: kind
    attributes:
      label: What are you sharing?
      options:
        - Complete station
        - Meteor detection
        - Waterfall / signal
        - Antenna or RF chain
        - Raspberry Pi / SDR hardware
        - Dashboard or software modification
        - Experiment or test
        - Other
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: Description
      description: Tell the community what you built, observed, or tested.
    validations:
      required: true
  - type: textarea
    id: setup
    attributes:
      label: Hardware and software
      placeholder: Pi model, RTL-SDR, antenna, LNA, operating system, MeteorRadio version...
    validations:
      required: false
  - type: textarea
    id: media
    attributes:
      label: Screenshots, waterfalls, photos, or links
      description: Drag images into this field or add links.
    validations:
      required: false
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: I checked images and text for passwords, tokens, exact private location data, hostnames, and private IP addresses.
          required: true
